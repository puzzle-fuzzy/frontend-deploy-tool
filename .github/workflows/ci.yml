name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit high and critical dependency vulnerabilities
        env:
          npm_config_registry: https://registry.npmjs.org
        run: bun run security:audit

      - name: Verify
        id: verify
        shell: bash
        run: |
          set -o pipefail
          bun run verify 2>&1 | tee verify.log

      - name: Upload verification log
        if: always() && steps.verify.outcome != 'skipped'
        uses: actions/upload-artifact@v6
        with:
          name: deploykit-verify-${{ github.sha }}
          path: verify.log
          if-no-files-found: error
          retention-days: 14

      - name: Upload verified Web bundle
        if: success()
        uses: actions/upload-artifact@v6
        with:
          name: deploykit-web-${{ github.sha }}
          path: |
            apps/web/dist
            apps/server/public
          if-no-files-found: error
          retention-days: 14
